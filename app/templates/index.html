<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #141e30, #243b55);
            font-family: Arial, sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: rgba(0,0,0,0.4);
            padding: 40px;
            border-radius: 15px;
            width: 60%;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 30px;
            font-size: 40px;
        }

        textarea {
            width: 90%;
            height: 200px;
            border-radius: 10px;
            border: none;
            padding: 15px;
            font-size: 16px;
            resize: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #00c6ff;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0072ff;
        }

        .result {
            margin-top: 25px;
            font-size: 28px;
            font-weight: bold;
            color: yellow;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Fake News Detector AI</h1>

        <form action="/predict" method="POST">

            <textarea
                name="news"
                placeholder="Paste your news article here..."></textarea>

            <br>

            <button type="submit">Check News</button>

        </form>

        {% if prediction %}

            <div class="result">

                Result: {{ prediction }}

            </div>

        {% endif %}

    </div>

</body>

</html>
